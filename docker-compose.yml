services:
  db:
    image: postgres:15-alpine
    container_name: tecnostock_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tecnostock_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: tecnostock_app
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tecnostock_db
    depends_on:
      - db

  tests:
    build: .
    container_name: tecnostock_tests
    command: pytest -v --cov=src
    volumes:
      - .:/app
    environment:
      - PYTHONPATH=.
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/tecnostock_db
    depends_on:
      - db

volumes:
  postgres_data: